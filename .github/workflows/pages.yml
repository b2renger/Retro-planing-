# Publishes the web build to GitHub Pages.
#
# The web build is the full app minus the two things a browser cannot do: LAN farm discovery (UDP
# multicast) and calling a farm at all (a https: page may not request a http: LAN address — mixed
# content is blocked before the request leaves). Cloud AI providers, Drive/OneDrive sync and the
# exports all work client-side, so no server is deployed with it.
name: Deploy web build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a superseded run is cancelled rather than queued.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The gate runs here too: a broken build should never reach the published site.
      - run: npm run typecheck
      - run: npm test

      # The app's own OAuth client ids are baked in here so users never touch a console.
      # They are NOT secrets (a browser client id is visible in the authorize URL), but they live
      # in repository secrets so one person owns them and they are easy to rotate. Add them under
      # Settings > Secrets and variables > Actions — see docs/CLOUD-SETUP.md. With neither set the
      # build still succeeds and the app reports itself as having no cloud credentials.
      # No Google secret here: the web build uses the implicit flow and never sends one.
      - run: npm run build:web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MS_CLIENT_ID: ${{ secrets.VITE_MS_CLIENT_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
